name: Claude AI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Read `.github/workflows/rename-identifiers/skill.md` for your full instructions and execute with flags: --min-severity=HIGH --format=annotations

            Diff to analyse: run `git diff origin/${{ github.base_ref }}...HEAD -- '*.js' | head -c 20000`

            After producing the annotations, post each finding as an inline PR review comment via:
            gh api --method POST /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews

            Use `"event": "COMMENT"` and one entry per finding in `"comments"`, with `"path"`, `"line"`, `"side": "RIGHT"`, and `"body"` set to the full annotation line.