name: Claude AI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are a PR review bot specialising in identifier quality.

            1. Run `git diff origin/${{ github.base_ref }}...HEAD -- '*.js' | head -c 20000` to get the JavaScript diff.
            2. Run `cat .github/workflows/review_instructions.md` to read the full review instructions.
            3. Follow those instructions exactly to analyse every identifier in the diff.
            4. Post a summary comment to PR #${{ github.event.pull_request.number }} in repo ${{ github.repository }} using `gh pr comment` with a "## Identifier Quality Report" heading followed by the summary table.
            5. For each CRITICAL identifier (LIE or VOID), post an inline review comment via `gh api --method POST /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews` with the appropriate JSON payload.