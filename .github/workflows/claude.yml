name: Claude AI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Analysis
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Read `.github/workflows/rename-identifiers/skill.md` for your full instructions and execute with flags: --min-severity=HIGH --format=annotations

            Diff to analyse: run `git diff origin/${{ github.base_ref }}...HEAD -- '*.js' | head -c 20000`

            Write ONLY the JSON object (matching the schema in phase-5-annotations.md) — no preamble, no prose — to `/tmp/annotations.json`.

      - name: Post inline comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/annotations.json ]; then
            echo "No annotations produced"
            exit 0
          fi

          FINDINGS=$(jq '.findings' /tmp/annotations.json)
          if [ "$(echo "$FINDINGS" | jq 'length')" -eq 0 ]; then
            echo "No findings to post"
            exit 0
          fi

          # Post a PR-level summary comment
          SUMMARY=$(jq -r '.summary' /tmp/annotations.json)
          gh pr comment ${{ github.event.pull_request.number }} --body "$SUMMARY"

          # Build inline review comments from findings
          COMMENTS=$(echo "$FINDINGS" | jq '[.[] | {
            path: .file,
            line: .line,
            side: "RIGHT",
            body: "**\(.category)** `\(.oldName)` → `\(.proposedName)` — \(.reason)"
          }]')

          gh api --method POST \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --input - <<< "$(jq -n --argjson c "$COMMENTS" '{"event": "COMMENT", "comments": $c}')"

      - name: Run PR Analysis (Correctness)
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Read `.github/workflows/pr-analysis/skill.md` for your top-level instructions.

            Before running any analysis, read every file the skill references for the correctness category:
            - `.github/workflows/pr-analysis/shared/suppression-rules.md`
            - `.github/workflows/pr-analysis/shared/comment-format.md`
            - `.github/workflows/pr-analysis/correctness/null-access.md`
            - `.github/workflows/pr-analysis/correctness/swallowed-exceptions.md`
            - `.github/workflows/pr-analysis/correctness/suspicious-conditional.md`
            - `.github/workflows/pr-analysis/correctness/mutation-of-input.md`
            - `.github/workflows/pr-analysis/correctness/implicit-boolean-coercion.md`
            - `.github/workflows/pr-analysis/correctness/implicit-test-ordering.md`
            - `.github/workflows/pr-analysis/correctness/suppression-rules.md`

            Then execute with flags: --category=correctness --format=annotations

            Diff to analyse: run `git diff origin/${{ github.base_ref }}...HEAD -- '*.js' | head -c 20000`

            Write ONLY the JSON array — no preamble, no prose — to `/tmp/correctness.json`.

      - name: Post correctness inline comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/correctness.json ]; then
            echo "No correctness annotations produced"
            exit 0
          fi

          FINDINGS=$(jq '.' /tmp/correctness.json)
          if [ "$(echo "$FINDINGS" | jq 'length')" -eq 0 ]; then
            echo "No correctness findings to post"
            exit 0
          fi

          # Build inline review comments: "Pass (Severity): claim. suggested_fix"
          COMMENTS=$(echo "$FINDINGS" | jq '[.[] | {
            path: .file,
            line: .line,
            side: "RIGHT",
            body: "**\(.pass)** (`\(.confidence)` confidence): \(.claim)\n\n> \(.suggested_fix)"
          }]')

          gh api --method POST \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --input - <<< "$(jq -n --argjson c "$COMMENTS" '{"event": "COMMENT", "comments": $c}')"