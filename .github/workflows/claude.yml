name: Claude AI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  rename-identifiers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI and skills
        run: |
          npm install -g @anthropic-ai/claude-code
          mkdir -p ~/.claude/commands
          cp .github/workflows/rename-identifiers/skill.md ~/.claude/commands/rename-identifiers.md
          cp -r .github/workflows/rename-identifiers/references ~/.claude/commands/references

      - name: Run Rename Identifiers Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --allowedPaths /tmp -p "/rename-identifiers --min-severity=HIGH --format=annotations

          Diff to analyse: run \`git diff origin/${{ github.base_ref }}...HEAD -- '*.js' | head -c 20000\`

          Output ONLY the raw JSON object — no preamble, no prose, no markdown fences." > /tmp/annotations.json

      - name: Post inline comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/annotations.json ]; then
            echo "No annotations produced"
            exit 0
          fi

          FINDINGS=$(jq '.findings' /tmp/annotations.json)
          if [ "$(echo "$FINDINGS" | jq 'length')" -eq 0 ]; then
            echo "No findings to post"
            exit 0
          fi

          # Post a PR-level summary comment
          SUMMARY=$(jq -r '.summary' /tmp/annotations.json)
          gh pr comment ${{ github.event.pull_request.number }} --body "$SUMMARY"

          # Build inline review comments from findings
          COMMENTS=$(echo "$FINDINGS" | jq '[.[] | {
            path: .file,
            line: .line,
            side: "RIGHT",
            body: "**\(.category)** `\(.oldName)` → `\(.proposedName)` — \(.reason)"
          }]')

          gh api --method POST \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --input - <<< "$(jq -n --argjson c "$COMMENTS" '{"event": "COMMENT", "comments": $c}')"

  pr-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI and skills
        run: |
          npm install -g @anthropic-ai/claude-code
          mkdir -p ~/.claude/commands
          cp .github/workflows/pr-analysis/skill.md ~/.claude/commands/pr-analysis.md
          cp -r .github/workflows/pr-analysis/correctness ~/.claude/commands/correctness
          cp -r .github/workflows/pr-analysis/overengineering ~/.claude/commands/overengineering
          cp -r .github/workflows/pr-analysis/maintainability ~/.claude/commands/maintainability
          cp -r .github/workflows/pr-analysis/comprehension ~/.claude/commands/comprehension
          cp -r .github/workflows/pr-analysis/shared ~/.claude/commands/shared

      - name: Run PR Analysis (Correctness)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --allowedPaths /tmp -p "/pr-analysis --category=correctness --format=annotations

          Diff to analyse: run \`git diff origin/${{ github.base_ref }}...HEAD -- '*.js' | head -c 20000\`

          Output ONLY the raw JSON array — no preamble, no prose, no markdown fences." > /tmp/correctness.json

      - name: Post correctness inline comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/correctness.json ]; then
            echo "No correctness annotations produced"
            exit 0
          fi

          FINDINGS=$(jq '.findings' /tmp/correctness.json)
          if [ "$(echo "$FINDINGS" | jq 'length')" -eq 0 ]; then
            echo "No correctness findings to post"
            exit 0
          fi

          # Post a PR-level summary comment
          SUMMARY=$(jq -r '.summary' /tmp/correctness.json)
          gh pr comment ${{ github.event.pull_request.number }} --body "$SUMMARY"

          # Build inline review comments from findings
          COMMENTS=$(echo "$FINDINGS" | jq '[.[] | {
            path: .file,
            line: .line,
            side: "RIGHT",
            body: "**\(.pass)** (`\(.confidence)` confidence): \(.claim)\n\n> \(.suggested_fix)"
          }]')

          gh api --method POST \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --input - <<< "$(jq -n --argjson c "$COMMENTS" '{"event": "COMMENT", "comments": $c}')"