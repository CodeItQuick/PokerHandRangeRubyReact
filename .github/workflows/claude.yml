name: Claude AI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  rename-identifiers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI and skill
        run: |
          npm install -g @anthropic-ai/claude-code
          mkdir -p ~/.claude/commands
          cp .github/workflows/rename-identifiers/skill.md ~/.claude/commands/rename-identifiers.md
          cp -r .github/workflows/rename-identifiers/references ~/.claude/commands/references

      - name: Analyse and post rename findings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FINDINGS=$(claude -p "/rename-identifiers --min-severity=HIGH --format=annotations

          Diff to analyse: run \`git diff origin/${{ github.base_ref }}...HEAD -- '*.js' | head -c 20000\`

          Output ONLY the raw JSON object — no preamble, no prose, no markdown fences." | jq '.findings')

          if [ "$(echo "$FINDINGS" | jq 'length')" -eq 0 ]; then
            echo "No findings to post"
            exit 0
          fi

          SUMMARY=$(echo "$FINDINGS" | jq -r '"Rename findings: \(length) identifiers flagged"')
          gh pr comment ${{ github.event.pull_request.number }} --body "$SUMMARY"

          COMMENTS=$(echo "$FINDINGS" | jq '[.[] | {
            path: .file,
            line: .line,
            side: "RIGHT",
            body: "**\(.category)** `\(.oldName)` → `\(.proposedName)` — \(.reason)"
          }]')

          gh api --method POST \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --input - <<< "$(jq -n --argjson c "$COMMENTS" '{"event": "COMMENT", "comments": $c}')"

  pr-analysis:
    needs: rename-identifiers
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

